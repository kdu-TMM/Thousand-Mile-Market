spring.application.name=TMM
server.port=9090

# ===== 데이터소스 (Docker MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/tmm_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=tmm_user
spring.datasource.password=tmm_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1000ms

# Redis Pub/Sub (SSE 실시간 입찰 알림)
# Docker 실행 후 true — docker-compose up -d
app.redis.pubsub.enabled=true

