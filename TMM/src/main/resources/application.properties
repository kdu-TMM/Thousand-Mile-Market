spring.application.name=TMM
server.port=9090

# ===== 데이터소스 (H2 인메모리) =====
# 채팅/상품/유저 데이터 → Firestore
# 경매 JPA 엔티티(Auction, AuctionBid, AuctionItem) → H2
spring.datasource.url=jdbc:h2:mem:tmmdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# H2 콘솔 (개발용)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Redis (docker-compose up -d 으로 실행) =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1000ms

# Redis Pub/Sub — Docker Redis 실행 중이면 true
app.redis.pubsub.enabled=true

# ===== Firebase =====
# 서비스 계정 키 경로 (아래 셋 중 하나 설정)
# 1) 여기서 직접 경로 지정:
# firebase.credentials.path=C:/path/to/firebase-service-account.json
# 2) src/main/resources/firebase-service-account.json 에 파일 배치
# 3) 환경변수 GOOGLE_APPLICATION_CREDENTIALS=/path/to/key.json
