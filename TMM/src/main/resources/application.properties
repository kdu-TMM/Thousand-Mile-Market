spring.application.name=TMM
server.port=9090

# 채팅은 Firestore(클라이언트 SDK)로 저장
# JPA 엔티티 없음 — H2는 스프링 기동용으로만 유지 (데이터 저장 안 함)
spring.datasource.url=jdbc:h2:mem:tmmdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Redis (로컬 개발용 - 서버 없으면 연결 실패해도 앱 기동은 됨)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=1000ms

# MySQL 운영 전환 시 아래 설정 활성화 (위 H2 설정 주석 처리)
