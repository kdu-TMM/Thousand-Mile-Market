<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- 접근 차단 오버레이 -->
    <div id="adminGuard" class="admin-guard" style="display:none;">
        <div class="admin-guard-box">
            <div class="admin-guard-icon">🔒</div>
            <h2>접근 권한이 없습니다</h2>
            <p>관리자 계정으로 로그인해 주세요.</p>
            <button class="btn-primary" onclick="location.href='/'">홈으로 이동</button>
        </div>
    </div>

    <!-- 로딩 -->
    <div id="adminLoading" class="admin-loading">
        <div class="admin-loading-spinner"></div>
        <p>권한 확인 중...</p>
    </div>

    <!-- 관리자 콘텐츠 -->
    <main id="adminContent" class="admin-main" style="display:none;">
        <div class="admin-layout">

            <!-- 사이드바 -->
            <aside class="admin-sidebar">
                <div class="admin-sidebar-title">
                    <span class="admin-badge">ADMIN</span>
                    <span>관리자 패널</span>
                </div>
                <nav class="admin-nav">
                    <button class="admin-nav-item active" onclick="switchAdminTab('reports', this)">
                        <span class="admin-nav-icon">🚨</span> 신고 관리
                        <span class="admin-nav-badge" id="navBadgeReports"></span>
                    </button>
                    <button class="admin-nav-item" onclick="switchAdminTab('users', this)">
                        <span class="admin-nav-icon">👥</span> 사용자 관리
                    </button>
                    <button class="admin-nav-item" onclick="switchAdminTab('products', this)">
                        <span class="admin-nav-icon">📦</span> 상품 관리
                    </button>
                </nav>
            </aside>

            <!-- 콘텐츠 영역 -->
            <div class="admin-body">

                <!-- ===== 신고 관리 탭 ===== -->
                <section id="tabReports" class="admin-tab-panel">
                    <h2 class="admin-section-title">신고 관리</h2>

                    <div class="admin-filter-bar">
                        <button class="admin-filter-btn active" onclick="filterReports('검토중', this)">검토중</button>
                        <button class="admin-filter-btn" onclick="filterReports('처리완료', this)">처리완료</button>
                        <button class="admin-filter-btn" onclick="filterReports('반려', this)">반려</button>
                    </div>

                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>신고 유형</th>
                                    <th>신고 대상</th>
                                    <th>작성자</th>
                                    <th>신고 사유</th>
                                    <th>신고자</th>
                                    <th>신고일</th>
                                    <th>상태</th>
                                    <th>처리</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody">
                                <tr><td colspan="8" class="admin-empty">불러오는 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- ===== 사용자 관리 탭 ===== -->
                <section id="tabUsers" class="admin-tab-panel" style="display:none;">
                    <h2 class="admin-section-title">사용자 관리</h2>

                    <div class="admin-search-bar">
                        <input type="text" id="userSearchInput" class="admin-search-input" placeholder="닉네임 또는 아이디 검색">
                        <button class="admin-search-btn" onclick="searchUsers()">검색</button>
                    </div>

                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>닉네임</th>
                                    <th>아이디</th>
                                    <th>신고된 게시물</th>
                                    <th>가입일</th>
                                    <th>상태</th>
                                    <th>처리</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                <tr><td colspan="6" class="admin-empty">불러오는 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- ===== 상품 관리 탭 ===== -->
                <section id="tabProducts" class="admin-tab-panel" style="display:none;">
                    <h2 class="admin-section-title">상품 관리</h2>

                    <div class="admin-filter-bar">
                        <button class="admin-filter-btn active" onclick="filterProducts('all', this)">전체</button>
                        <button class="admin-filter-btn" onclick="filterProducts('판매중', this)">판매중</button>
                        <button class="admin-filter-btn" onclick="filterProducts('경매중', this)">경매중</button>
                        <button class="admin-filter-btn" onclick="filterProducts('판매완료', this)">판매완료</button>
                        <button class="admin-filter-btn" onclick="filterProducts('숨김', this)">숨김</button>
                    </div>

                    <div class="admin-table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>상품명</th>
                                    <th>가격</th>
                                    <th>판매자</th>
                                    <th>카테고리</th>
                                    <th>등록일</th>
                                    <th>상태</th>
                                    <th>처리</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody">
                                <tr><td colspan="7" class="admin-empty">불러오는 중...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- 신고 상세 모달 -->
    <div id="reportDetailModal" class="admin-modal-overlay" style="display:none;" onclick="closeReportModal(event)">
        <div class="admin-modal-box">
            <button class="admin-modal-close" onclick="closeReportModal()">✕</button>
            <h3 class="admin-modal-title">신고 상세</h3>
            <div id="reportDetailBody" class="admin-modal-body"></div>
            <div class="admin-modal-actions">
                <button class="admin-action-btn hide-btn" onclick="updateReportStatus('숨김')">숨김</button>
                <button class="admin-action-btn reject" onclick="updateReportStatus('반려')">반려</button>
            </div>
            <textarea id="reportAdminNote" class="admin-note-input" placeholder="관리자 메모 (선택사항)"></textarea>
        </div>
    </div>

</div>

<script type="module" th:src="@{/js/firebase.js}"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
