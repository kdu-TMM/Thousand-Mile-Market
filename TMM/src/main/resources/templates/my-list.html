<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 목록 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="page-box">
            <h2 class="page-title">내 목록</h2>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('wish', this)">찜 목록</button>
                <button class="tab-btn" onclick="switchTab('buy', this)">구매내역</button>
            </div>

            <!-- 찜 목록 -->
            <div id="tab-wish" class="tab-content">
                <div class="product-grid">
                    <div class="product-card" th:each="i : ${#numbers.sequence(1, 6)}">
                        <div class="product-image"><span>(사진)</span></div>
                        <div class="product-info">
                            <h3 class="product-title">찜한 물품 <span th:text="${i}"></span></h3>
                            <div class="product-details">
                                <span class="product-price">50,000</span>
                                <span class="product-date">3일 전</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 구매내역 -->
            <div id="tab-buy" class="tab-content" style="display:none;">
                <ul class="sales-list">
                    <li class="sales-item">
                        <div class="sales-thumb">(사진)</div>
                        <div class="sales-info">
                            <p class="sales-name">에어팟 맥스</p>
                            <p class="sales-price">350,000원</p>
                            <p class="sales-date">2024.03.01</p>
                        </div>
                        <span class="badge badge-done">거래완료</span>
                    </li>
                    <li class="sales-item">
                        <div class="sales-thumb">(사진)</div>
                        <div class="sales-info">
                            <p class="sales-name">키보드 HHKB</p>
                            <p class="sales-price">120,000원</p>
                            <p class="sales-date">2024.02.15</p>
                        </div>
                        <span class="badge badge-done">거래완료</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.getElementById('tab-' + tab).style.display = 'block';
        }
    </script>
</div>
</body>
</html>
