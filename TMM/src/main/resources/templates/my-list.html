<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 목록 - 천리마켓</title>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/my-list.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div id="mylistAuthGuard" class="auth-guard" style="display:none;">
            <span class="auth-guard-icon">🔒</span>
            <p>내 목록은 로그인 후 이용할 수 있습니다.</p>
            <button class="btn-primary" onclick="openLoginModal()">로그인하기</button>
        </div>

        <div id="mylistContent" class="page-box mylist-box" style="display:none;">
            <h2 class="page-title">내 목록</h2>

            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchListTab('wish', this)">찜 목록</button>
                <button class="tab-btn" onclick="switchListTab('sales', this)">판매목록</button>
                <button class="tab-btn" onclick="switchListTab('buy', this)">구매내역</button>
            </div>

            <!-- ===== 찜 목록 ===== -->
            <div id="tab-wish" class="tab-content">
                <p id="wishLoading" class="list-empty">불러오는 중...</p>
                <div id="wishList" class="product-grid wish-grid"></div>
                <p id="wishEmpty" class="list-empty" style="display:none;">찜한 상품이 없습니다.</p>
            </div>

            <!-- ===== 판매목록 ===== -->
            <div id="tab-sales" class="tab-content" style="display:none;">
                <div class="sub-tab-bar">
                    <button class="sub-tab-btn active" onclick="filterSales('all', this)">전체</button>
                    <button class="sub-tab-btn" onclick="filterSales('판매중', this)">판매중</button>
                    <button class="sub-tab-btn" onclick="filterSales('경매중', this)">경매중</button>
                    <button class="sub-tab-btn" onclick="filterSales('예약중', this)">예약중</button>
                    <button class="sub-tab-btn" onclick="filterSales('판매완료', this)">판매완료</button>
                </div>
                <p id="salesLoading" class="list-empty">불러오는 중...</p>
                <ul id="salesList" class="sales-list"></ul>
                <p id="salesEmpty" class="list-empty" style="display:none;">등록된 상품이 없습니다.</p>
            </div>

            <!-- ===== 구매내역 ===== -->
            <div id="tab-buy" class="tab-content" style="display:none;">
                <p id="buyLoading" class="list-empty">불러오는 중...</p>
                <ul id="buyList" class="sales-list"></ul>
                <p id="buyEmpty" class="list-empty" style="display:none;">구매 내역이 없습니다.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>
    <script th:src="@{/js/my-list.js}"></script>
</div>
</body>
</html>
