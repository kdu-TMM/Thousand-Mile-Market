<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="signup-content">
            <div class="signup-main">

                <span class="signup-title">회원가입</span>
                <span class="signup-subtitle">천리마켓에 오신 것을 환영합니다</span>

                <form onsubmit="return false;">

                    <!-- 필수 항목 -->
                    <div class="signup-field-group">

                        <div class="signup-row">
                            <label class="signup-label">
                                아이디 <span class="signup-required">*</span>
                            </label>
                            <div class="signup-input-with-btn">
                                <input type="text" id="signupUserId" class="signup-input"
                                    placeholder="영문+숫자 포함 4~12자"
                                    oninput="resetIdCheck()">
                                <button type="button" class="signup-check-btn" onclick="checkUserId()">중복확인</button>
                            </div>
                        </div>
                        <p id="msgUserId" class="signup-msg-row"></p>

                        <div class="signup-row">
                            <label class="signup-label">
                                비밀번호 <span class="signup-required">*</span>
                            </label>
                            <input type="password" id="signupPw" class="signup-input"
                                placeholder="8자 이상">
                        </div>

                        <div class="signup-row">
                            <label class="signup-label">
                                비밀번호 확인 <span class="signup-required">*</span>
                            </label>
                            <input type="password" id="signupPwConfirm" class="signup-input"
                                placeholder="비밀번호 재입력">
                        </div>
                        <p id="msgPw" class="signup-msg-row"></p>

                        <div class="signup-row">
                            <label class="signup-label">
                                닉네임 <span class="signup-required">*</span>
                            </label>
                            <input type="text" id="signupNickname" class="signup-input"
                                placeholder="2~10자">
                        </div>
                        <p id="msgNick" class="signup-msg-row"></p>

                        <!-- 전화번호 + 인증 버튼 -->
                        <div class="signup-row">
                            <label class="signup-label">
                                전화번호 <span class="signup-required">*</span>
                            </label>
                            <div class="signup-input-with-btn">
                                <input type="tel" id="signupPhone" class="signup-input"
                                    placeholder="01012345678"
                                    oninput="resetPhoneVerify()">
                                <button type="button" class="signup-check-btn" id="smsSendBtn"
                                    onclick="sendSmsCode()">인증</button>
                            </div>
                        </div>
                        <p id="msgPhone" class="signup-msg-row"></p>

                        <!-- 인증번호 입력 (발송 후 노출) -->
                        <div class="signup-row" id="smsCodeRow" style="display:none;">
                            <label class="signup-label">인증번호</label>
                            <div class="signup-input-with-btn">
                                <div class="sms-code-input-wrap">
                                    <input type="text" id="smsCode" class="signup-input"
                                        placeholder="6자리 숫자" maxlength="6" inputmode="numeric"
                                        onkeydown="if(event.key==='Enter')verifySmsCode()">
                                    <span id="smsTimer" class="sms-timer-badge"></span>
                                </div>
                                <button type="button" class="signup-check-btn" id="smsVerifyBtn"
                                    onclick="verifySmsCode()">확인</button>
                            </div>
                        </div>
                        <p id="msgSms" class="signup-msg-row"></p>

                    </div>

                    <!-- 선택 항목 -->
                    <div class="signup-optional-divider">선택 정보</div>
                    <div class="signup-field-group">

                        <div class="signup-row">
                            <label class="signup-label">거래 지역</label>
                            <div style="display:flex; gap:8px; flex:1;">
                                <select id="signupRegion" class="signup-input" style="flex:1;" onchange="updateSignupSigungu()">
                                    <option value="">지역 선택 (선택)</option>
                                    <option value="서울특별시">서울특별시</option>
                                    <option value="경기도">경기도</option>
                                    <option value="인천광역시">인천광역시</option>
                                    <option value="부산광역시">부산광역시</option>
                                    <option value="대구광역시">대구광역시</option>
                                    <option value="광주광역시">광주광역시</option>
                                    <option value="대전광역시">대전광역시</option>
                                    <option value="울산광역시">울산광역시</option>
                                    <option value="세종특별자치시">세종특별자치시</option>
                                    <option value="강원도">강원도</option>
                                    <option value="충청북도">충청북도</option>
                                    <option value="충청남도">충청남도</option>
                                    <option value="전라북도">전라북도</option>
                                    <option value="전라남도">전라남도</option>
                                    <option value="경상북도">경상북도</option>
                                    <option value="경상남도">경상남도</option>
                                    <option value="제주특별자치도">제주특별자치도</option>
                                </select>
                                <select id="signupSigungu" class="signup-input" style="flex:1;" disabled>
                                    <option value="">시/군/구 선택 (선택)</option>
                                </select>
                            </div>
                        </div>

                    </div>

                    <p id="signupMsg"></p>

                    <div class="signup-buttons">
                        <button type="button" id="signupSubmitBtn"
                            class="signup-submit" onclick="doSignup()">가입하기</button>
                        <p class="signup-login-link">
                            이미 계정이 있으신가요? <a href="javascript:openLoginModal()">로그인</a>
                        </p>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/signup.js}"></script>
</div>
</body>
</html>
