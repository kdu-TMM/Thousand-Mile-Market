<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/verify.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="page-box narrow">
            <h2 class="page-title">회원가입</h2>
            <form class="modal-form" onsubmit="return false;">
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="signupName" class="form-input" placeholder="이름" readonly>
                </div>
                <div class="form-group">
                    <label>전화번호</label>
                    <input type="tel" id="signupPhone" class="form-input" placeholder="010-0000-0000" readonly>
                </div>
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" id="signupUserId" class="form-input" placeholder="영문+숫자 포함 4~12자">
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" id="signupPw" class="form-input" placeholder="비밀번호 (8자 이상)">
                </div>
                <div class="form-group">
                    <label>비밀번호 확인</label>
                    <input type="password" id="signupPwConfirm" class="form-input" placeholder="비밀번호 재입력">
                </div>
                <div class="form-group">
                    <label>닉네임</label>
                    <input type="text" id="signupNickname" class="form-input" placeholder="닉네임 입력">
                </div>
                <div id="signupMsg" class="verify-msg" style="min-height:18px;"></div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="history.back()">취소</button>
                    <button type="button" id="signupSubmitBtn" class="btn-primary" onclick="doSignup()">가입하기</button>
                </div>
            </form>
        </div>
    </main>
    <script th:src="@{/js/signup.js}"></script>
</div>
</body>
</html>
