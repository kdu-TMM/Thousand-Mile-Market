<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매목록 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="page-box">
            <h2 class="page-title">판매목록</h2>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="filterSales('all', this)">전체</button>
                <button class="tab-btn" onclick="filterSales('판매중', this)">판매중</button>
                <button class="tab-btn" onclick="filterSales('예약중', this)">예약중</button>
                <button class="tab-btn" onclick="filterSales('판매완료', this)">판매완료</button>
            </div>
            <ul class="sales-list" id="salesList">
                <li class="sales-item" data-status="판매중">
                    <div class="sales-thumb">(사진)</div>
                    <div class="sales-info">
                        <p class="sales-name">맥북 프로 14인치</p>
                        <p class="sales-price">2,200,000원</p>
                        <p class="sales-date">2024.03.15</p>
                    </div>
                    <span class="badge badge-on">판매중</span>
                </li>
                <li class="sales-item" data-status="예약중">
                    <div class="sales-thumb">(사진)</div>
                    <div class="sales-info">
                        <p class="sales-name">에어팟 프로 2세대</p>
                        <p class="sales-price">180,000원</p>
                        <p class="sales-date">2024.03.10</p>
                    </div>
                    <span class="badge badge-reserve">예약중</span>
                </li>
                <li class="sales-item" data-status="판매완료">
                    <div class="sales-thumb">(사진)</div>
                    <div class="sales-info">
                        <p class="sales-name">닌텐도 스위치</p>
                        <p class="sales-price">230,000원</p>
                        <p class="sales-date">2024.02.28</p>
                    </div>
                    <span class="badge badge-done">판매완료</span>
                </li>
            </ul>
        </div>
    </main>

    <script>
        function filterSales(status, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.sales-item').forEach(item => {
                item.style.display = (status === 'all' || item.dataset.status === status) ? 'flex' : 'none';
            });
        }
    </script>
</div>
</body>
</html>
