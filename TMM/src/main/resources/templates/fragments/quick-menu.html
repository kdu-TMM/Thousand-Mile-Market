<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="quickMenu" class="quick-menu">

    <!-- 최근 본 상품 썸네일 -->
    <div class="qm-recent-section">
        <div class="qm-recent-label">최근 본 상품</div>
        <div id="qmThumbList" class="qm-thumb-list"></div>
    </div>

    <!-- TOP 버튼 -->
    <button class="qm-top" id="btnTop"
            onclick="window.scrollTo({top:0, behavior:'smooth'})">
        TOP
    </button>

    <script th:src="@{/js/quick-menu.js}"></script>
</aside>

</body>
</html>
