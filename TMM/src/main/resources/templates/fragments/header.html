<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <div class="header-utility-bar">
        <div class="utility-inner">
            <button onclick="openLoginModal()">로그인</button>
            <span class="utility-divider">|</span>
            <button onclick="location.href='/mypage'">마이페이지</button>
        </div>
    </div>
    <div class="header-top">
        <div class="logo" onclick="location.href='/'">천리마켓</div>
        <div class="search-bar">
            <input type="text" placeholder="상품명 검색" class="search-input" id="searchInput">
            <button class="search-button" onclick="doSearch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </div>
        <div class="header-menu">
            <button onclick="location.href='/sell'">판매</button>
            <span class="menu-divider">|</span>
            <button onclick="location.href='/my-list'">내 목록</button>
            <span class="menu-divider">|</span>
            <button onclick="location.href='/chat'">대화하기</button>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="modal-overlay" onclick="closeLoginModal(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeLoginModal()">✕</button>
            <h2 class="modal-title">로그인</h2>
            <form class="modal-form" onsubmit="return false;">
                <input type="text" placeholder="아이디" class="form-input">
                <input type="password" placeholder="비밀번호" class="form-input">
                <button type="submit" class="btn-primary">로그인</button>
            </form>
            <div class="modal-divider"><span>또는</span></div>
            <button class="btn-secondary" onclick="location.href='/verify'">회원가입</button>
        </div>
    </div>

    <script th:src="@{/js/header.js}"></script>
</header>
</body>
</html>
