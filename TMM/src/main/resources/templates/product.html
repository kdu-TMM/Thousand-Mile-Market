<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 상세 - 천리마켓</title>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">

        <!-- 브레드크럼 -->
        <div class="pd-breadcrumb">
            <a href="/">홈</a>
            <span>›</span>
            <span id="pdCatLabel">카테고리</span>
            <span>›</span>
            <span id="pdTitleShort">상품명</span>
            <a href="/" class="pd-go-list">목록으로</a>
        </div>

        <!-- 상품 상세 (JS로 채움) -->
        <section id="item-detail" class="pd-center">

            <div id="item-info">
                <!-- 이미지 영역 -->
                <div id="image-area">
                    <button id="left-btn" class="pd-slide-btn" onclick="prevSlide()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div id="pdImgMain"></div>
                    <button id="right-btn" class="pd-slide-btn" onclick="nextSlide()">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <div id="pdDots"></div>
                    <span id="pdTradeComplete" class="pd-trade-badge" style="display:none;">거래완료</span>
                </div>

                <!-- 정보 영역 -->
                <div id="info-area">
                    <div class="pd-title-row">
                        <div id="pdStatusBadge" class="pd-status-badge"></div>
                        <h1 id="pdTitle"></h1>
                    </div>

                    <div id="item-price">
                        <span class="pd-price" id="pdPrice"></span>
                        <span class="pd-price-unit">원</span>
                    </div>

                    <!-- 경매 전용 -->
                    <div id="pdBidArea" style="display:none;" class="pd-bid-area">
                        <div class="pd-bid-row"><span class="pd-bid-label">시작가</span><span id="pdStartPrice"></span></div>
                        <div class="pd-bid-row"><span class="pd-bid-label">현재가</span><span class="pd-bid-current" id="pdCurrentPrice"></span></div>
                        <div class="pd-bid-row"><span class="pd-bid-label">입찰 수</span><span id="pdBidCount"></span></div>
                        <div class="pd-bid-row"><span class="pd-bid-label">남은 시간</span><span class="pd-bid-timer" id="pdAuctionTimer"></span></div>
                    </div>

                    <div id="item-stats">
                        <div class="pd-stats-left">
                            <span class="pd-stat"><i class="fa-regular fa-heart"></i> <span id="pdWishes">0</span></span>
                            <span class="pd-stat"><i class="fa-regular fa-eye"></i> <span id="pdViews">0</span></span>
                            <span class="pd-stat"><i class="fa-regular fa-clock"></i> <span id="pdDateLabel"></span></span>
                        </div>
                        <span class="pd-report" onclick="openReportModal()">
                            <i class="fa-solid fa-siren"></i> 신고
                        </span>
                    </div>

                    <div class="pd-meta-table">
                        <div class="pd-meta-row"><span class="pd-meta-key">상품상태</span><span class="pd-meta-val" id="pdCondition"></span></div>
                        <div class="pd-meta-row"><span class="pd-meta-key">거래지역</span><span class="pd-meta-val" id="pdRegion"></span></div>
                    </div>

                    <div id="item-description">
                        <p id="pdDescription"></p>
                    </div>
                </div>
            </div>

            <!-- 판매자 프로필 + 찜/채팅 -->
            <div class="pd-bottom-row">
                <div id="user-profile">
                    <div class="pd-seller-left">
                        <img id="pdSellerImg" src="/images/common/user.png" alt="프로필" class="pd-skeleton">
                        <div class="pd-seller-info">
                            <span class="pd-seller-nickname pd-skeleton" id="pdSellerNickname"></span>
                            <span class="pd-seller-region pd-skeleton" id="pdSellerRegion"></span>
                        </div>
                    </div>
                    <div class="rating-stars">
                        <i class="fa-solid fa-star"></i>
                        <span class="pd-rating pd-skeleton" id="pdRating"></span>
                    </div>
                </div>

                <div id="heart-chatting">
                    <button id="pdWishBtn" class="pd-heart-btn" onclick="toggleWish()">
                        <i class="fa-regular fa-heart" id="pdWishIcon"></i>
                        <span id="pdWishCount">0</span>
                    </button>
                    <div id="pdActionArea">
                        <!-- JS가 경매 상태/유저에 따라 버튼을 채워 넣음 -->
                    </div>
                </div>
            </div>

        </section>

        <!-- 비슷한 상품 -->
        <section id="similar-item" class="pd-center" style="display:none;">
            <div class="pd-similar-header">
                <h3>이 상품과 비슷해요</h3>
                <span id="pdSimilarPage"></span>
            </div>
            <div class="pd-similar-scroll-wrap">
                <button class="pd-similar-arrow" onclick="scrollSimilar(-1)">‹</button>
                <div id="pdSimilarGrid" class="pd-similar-grid"></div>
                <button class="pd-similar-arrow" onclick="scrollSimilar(1)">›</button>
            </div>
        </section>

        <!-- 신고 모달 -->
        <div id="reportModal" class="report-modal-overlay" style="display:none;" onclick="closeReportModal(event)">
            <div class="report-modal-box">
                <button class="report-modal-close" onclick="closeReportModal()">✕</button>
                <h3 class="report-modal-title">게시물 신고</h3>
                <p class="report-modal-desc">신고 사유를 선택해 주세요.</p>
                <div class="report-reason-list">
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="사기 의심"> 사기 의심
                    </label>
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="허위 상품 정보"> 허위 상품 정보
                    </label>
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="불법/규정 위반 상품"> 불법/규정 위반 상품
                    </label>
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="부적절한 사진"> 부적절한 사진
                    </label>
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="도배/스팸"> 도배/스팸
                    </label>
                    <label class="report-reason-item">
                        <input type="radio" name="reportReason" value="기타" onchange="toggleReportDetail(true)"> 기타
                    </label>
                </div>
                <textarea id="reportDetail" class="report-detail-input" placeholder="신고 내용을 입력해 주세요." style="display:none;"></textarea>
                <div id="reportMsg" class="report-msg"></div>
                <button class="report-submit-btn" onclick="submitReport()">신고하기</button>
            </div>
        </div>

        <!-- 입찰 모달 -->
        <div id="bidModal" class="bid-modal-overlay" style="display:none;" onclick="closeBidModal(event)">
            <div class="bid-modal-box">
                <button class="bid-modal-close" onclick="closeBidModal()">✕</button>
                <h3 class="bid-modal-title">입찰하기</h3>
                <p class="bid-modal-current">현재가 <strong id="bidCurrentDisplay">0</strong>원</p>
                <p class="bid-modal-min">최소 입찰가 <strong id="bidMinDisplay">0</strong>원 이상</p>
                <div class="bid-input-row">
                    <input type="number" id="bidAmountInput" class="bid-amount-input" placeholder="입찰 금액">
                    <span class="bid-unit">원</span>
                </div>
                <div id="bidMsg" class="bid-msg"></div>
                <button class="bid-submit-btn" onclick="submitBid()">입찰하기</button>
            </div>
        </div>

        <!-- 에러 -->
        <div class="pd-error" id="pdError" style="display:none;">
            <p>상품을 찾을 수 없습니다.</p>
            <button class="btn-primary" style="width:auto;padding:10px 24px;" onclick="location.href='/'">홈으로</button>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>
    <script>
        document.querySelector('.footer')?.classList.add('app-footer-hidden');
    </script>
    <script th:src="@{/js/product.js}"></script>
</div>
</body>
</html>
