<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>판매 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/sell.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">

        <div id="sellAuthGuard" class="auth-guard" style="display:none;">
            <span class="auth-guard-icon">🔒</span>
            <p>판매 등록은 로그인 후 이용할 수 있습니다.</p>
            <button class="btn-primary" onclick="openLoginModal()">로그인하기</button>
        </div>

        <div id="sellContent" class="sell-container" style="display:none;">
            <h2 class="sell-title">중고 상품 등록</h2>

            <form class="sell-form" onsubmit="return false;">

                    <ul class="form-list">

                        <!-- 사진 첨부 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">사진 첨부</span>
                            </div>
                            <div class="field-area">
                                <ul id="img-preview-list">
                                    <li id="imgUploadBtn" onclick="document.getElementById('imgInput').click()">
                                        <i class="fas fa-camera"></i>
                                        <span id="photoCount">0/10</span>
                                    </li>
                                </ul>
                                <input type="file" id="imgInput" accept="image/*" multiple style="display:none">
                                <p class="field-hint">최대 10장 / 첫 번째 사진이 대표 이미지입니다</p>
                            </div>
                        </li>

                        <!-- 제목 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">상품 제목</span>
                            </div>
                            <div class="field-area">
                                <input type="text" class="form-control" id="sellTitle" placeholder="상품명을 입력해 주세요.">
                            </div>
                        </li>

                        <!-- 카테고리 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">카테고리</span>
                            </div>
                            <div class="field-area">
                                <select class="form-control form-select" id="sellCategory">
                                    <option value="">카테고리 선택</option>
                                    <option>디지털/가전</option>
                                    <option>의류/잡화</option>
                                    <option>가구/인테리어</option>
                                    <option>도서/음반</option>
                                    <option>스포츠/레저</option>
                                    <option>기타</option>
                                </select>
                            </div>
                        </li>

                        <!-- 상품 상태 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">상품 상태</span>
                            </div>
                            <div class="field-area">
                                <select class="form-control form-select" id="sellCondition">
                                    <option value="">상태 선택</option>
                                    <option>중고 (거의 새것)</option>
                                    <option>중고 (상태 양호)</option>
                                    <option>중고 (사용감 있음)</option>
                                    <option>중고 (작동 확인)</option>
                                </select>
                            </div>
                        </li>

                        <!-- 판매 방식 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">판매 방식</span>
                            </div>
                            <div class="field-area">
                                <div class="sell-type-wrap">
                                    <label class="sell-type-option">
                                        <input type="radio" name="sellType" value="normal" checked onchange="toggleAuctionFields(this)">
                                        <span>일반 판매</span>
                                    </label>
                                    <label class="sell-type-option">
                                        <input type="radio" name="sellType" value="auction" onchange="toggleAuctionFields(this)">
                                        <span>경매</span>
                                    </label>
                                </div>
                            </div>
                        </li>

                        <!-- 가격 (일반) -->
                        <li class="form-item" id="normalPriceRow">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">판매 가격</span>
                            </div>
                            <div class="field-area">
                                <div class="price-input-wrap">
                                    <input type="number" class="form-control price-input" id="sellPrice" placeholder="가격을 입력하세요">
                                    <span class="price-unit">원</span>
                                    <label class="nego-label">
                                        <input type="checkbox" id="sellNego"> 가격 제안 받기
                                    </label>
                                </div>
                            </div>
                        </li>

                        <!-- 경매 필드 -->
                        <li class="form-item" id="auctionStartRow" style="display:none;">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">시작가</span>
                            </div>
                            <div class="field-area">
                                <div class="price-input-wrap">
                                    <input type="number" class="form-control price-input" id="sellStartPrice" placeholder="경매 시작 가격">
                                    <span class="price-unit">원</span>
                                </div>
                            </div>
                        </li>
                        <li class="form-item" id="auctionTimeRow" style="display:none;">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">경매 시간</span>
                            </div>
                            <div class="field-area">
                                <div class="price-input-wrap">
                                    <select class="form-control form-select" id="sellAuctionTime" style="max-width:200px;">
                                        <option value="1">1시간</option>
                                        <option value="3">3시간</option>
                                        <option value="6">6시간</option>
                                        <option value="12">12시간</option>
                                        <option value="24" selected>24시간</option>
                                        <option value="48">48시간</option>
                                        <option value="72">72시간</option>
                                    </select>
                                    <span class="price-unit">후 종료</span>
                                </div>
                            </div>
                        </li>

                        <!-- 상품 설명 -->
                        <li class="form-item description-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">상품 설명</span>
                            </div>
                            <div class="field-area">
                                <textarea class="form-control content-textarea" id="sellDescription"
                                    placeholder="물품 상태, 구매 시기, 하자 여부 등을 자세히 적어주세요."></textarea>
                            </div>
                        </li>

                        <!-- 거래 지역 -->
                        <li class="form-item">
                            <div class="label-area">
                                <span class="required">*</span>
                                <span class="form-label">거래 지역</span>
                            </div>
                            <div class="field-area">
                                <div class="region-select-wrap">
                                    <select class="form-control form-select" id="regionSido" onchange="updateSigungu()">
                                        <option value="">시/도 선택</option>
                                        <option value="서울특별시">서울특별시</option>
                                        <option value="경기도" selected>경기도</option>
                                        <option value="인천광역시">인천광역시</option>
                                        <option value="부산광역시">부산광역시</option>
                                        <option value="대구광역시">대구광역시</option>
                                        <option value="광주광역시">광주광역시</option>
                                        <option value="대전광역시">대전광역시</option>
                                        <option value="울산광역시">울산광역시</option>
                                        <option value="세종특별자치시">세종특별자치시</option>
                                        <option value="강원도">강원도</option>
                                        <option value="충청북도">충청북도</option>
                                        <option value="충청남도">충청남도</option>
                                        <option value="전라북도">전라북도</option>
                                        <option value="전라남도">전라남도</option>
                                        <option value="경상북도">경상북도</option>
                                        <option value="경상남도">경상남도</option>
                                        <option value="제주특별자치도">제주특별자치도</option>
                                    </select>
                                    <select class="form-control form-select" id="regionSigungu" onchange="updateDong()">
                                        <option value="">시/군/구 선택</option>
                                    </select>
                                    <select class="form-control form-select" id="regionDong">
                                        <option value="">읍/면/동 선택</option>
                                    </select>
                                </div>
                            </div>
                        </li>

                    </ul>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="history.back()">취소하기</button>
                        <button type="button" class="btn-submit" onclick="doSell()">등록하기</button>
                    </div>

                    <p id="sellMsg" class="sell-msg"></p>
                </form>
        </div>
    </main>

    <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>
    <script th:src="@{/js/sell.js}"></script>
</div>
</body>
</html>
