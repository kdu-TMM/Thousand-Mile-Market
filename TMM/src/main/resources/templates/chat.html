<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대화하기 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content chat-main">

        <!-- 로그인 안 된 상태 -->
        <div id="chatLoginPrompt" class="chat-login-prompt" style="display:none;">
            <p>채팅을 이용하려면 로그인이 필요합니다.</p>
            <button class="btn-primary" style="width:auto;padding:10px 32px;" onclick="openLoginModal()">로그인</button>
        </div>

        <!-- 채팅 레이아웃 -->
        <div id="chatLayout" class="chat-layout" style="display:none;">

            <!-- 왼쪽: 채팅방 목록 -->
            <aside class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3>채팅 목록</h3>
                    <div class="chat-search-box">
                        <input type="text" id="nickSearch" placeholder="닉네임 검색"
                               autocomplete="off" oninput="searchUser(this.value)">
                    </div>
                    <ul id="searchResult" class="chat-search-result hidden"></ul>
                </div>
                <ul id="chatRoomList" class="chat-room-list">
                    <li class="chat-room-empty">채팅방이 없습니다.</li>
                </ul>
            </aside>

            <!-- 오른쪽: 채팅 창 -->
            <section class="chat-window">
                <!-- 채팅방 선택 전 -->
                <div id="chatPlaceholder" class="chat-placeholder">
                    <p>채팅방을 선택하세요.</p>
                </div>

                <!-- 채팅 내용 -->
                <div id="chatContent" class="chat-content" style="display:none;">
                    <div class="chat-window-header">
                        <div class="chat-header-info">
                            <span id="chatPartnerName" class="chat-partner-name">상대방</span>
                            <span id="chatProductBadge" class="chat-product-badge" style="display:none;"></span>
                        </div>
                        <div class="chat-header-actions">
                            <button id="completeBtn" class="chat-action-btn" onclick="completeTrade()" title="거래완료">
                                ✅ 거래완료
                            </button>
                            <div class="chat-dropdown-wrap">
                                <button class="chat-action-btn" onclick="toggleDropdown()">⋮</button>
                                <div id="chatDropdown" class="chat-dropdown hidden">
                                    <p onclick="leaveRoom()">나가기</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <ul id="chatMessages" class="chat-messages"></ul>

                    <div class="chat-input-bar">
                        <textarea id="chatInput" class="chat-textarea" rows="2"
                                  placeholder="메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
                        <button id="sendBtn" class="chat-send-btn" onclick="sendMessage()">전송</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>

    <!-- Thymeleaf → JS 전달 -->
    <script th:inline="javascript">
        const SERVER_UID      = /*[[${loginUid}]]*/      null;
        const SERVER_NICKNAME = /*[[${loginNickname}]]*/ null;
        const INIT_TARGET_UID      = /*[[${initTargetUid}]]*/ null;
        const INIT_TARGET_NICKNAME = /*[[${initTargetNickname}]]*/ null;
        const INIT_PRODUCT_ID      = /*[[${initProductId}]]*/ null;
        const INIT_PRODUCT_NAME    = /*[[${initProductName}]]*/ null;
    </script>

    <script th:src="@{/js/chat.js}"></script>
</div>
</body>
</html>
