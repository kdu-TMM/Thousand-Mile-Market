<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대화하기 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content chat-main">

        <!-- 로그인 안 된 상태 -->
        <div id="chatLoginPrompt" class="chat-login-prompt" style="display:none;">
            <p>채팅을 이용하려면 로그인이 필요합니다.</p>
            <button class="btn-primary" style="width:auto;padding:10px 32px;" onclick="openLoginModal()">로그인</button>
        </div>

        <!-- 채팅 레이아웃 -->
        <div id="chatLayout" class="chat-layout" style="display:none;">

            <!-- 왼쪽: 채팅방 목록 -->
            <aside class="chat-sidebar">
                <div class="chat-sidebar-header">

                    <!-- 대화 유형 드롭다운 -->
                    <div class="chat-type-wrap">
                        <button class="chat-type-btn" id="chatTypeBtn" onclick="toggleTypeMenu()">
                            <span id="chatTypeLabel">전체 대화</span>
                            <span class="chat-type-arrow" id="chatTypeArrow">▾</span>
                        </button>
                        <div id="chatTypeMenu" class="chat-type-menu hidden">
                            <div class="chat-type-item" onclick="setTypeFilter('all')">전체 대화</div>
                            <div class="chat-type-item" onclick="setTypeFilter('sell')">판매 대화</div>
                            <div class="chat-type-item" onclick="setTypeFilter('buy')">구매 대화</div>
                        </div>
                    </div>

                    <!-- 닉네임 검색 -->
                    <div class="chat-search-wrap">
                        <div class="chat-search-box">
                            <input type="text" id="nickSearch" placeholder="채팅 상대 검색"
                                   autocomplete="off" oninput="searchUser(this.value)">
                        </div>
                    </div>

                    <!-- 상태 필터 탭 -->
                    <div class="chat-status-tabs">
                        <button class="chat-stab active" onclick="setStatusFilter('all', this)">전체</button>
                        <button class="chat-stab" onclick="setStatusFilter('waiting', this)">대기</button>
                        <button class="chat-stab" onclick="setStatusFilter('active', this)">진행중</button>
                        <button class="chat-stab" onclick="setStatusFilter('ended', this)">대화종료</button>
                    </div>
                </div>

                <ul id="chatRoomList" class="chat-room-list">
                    <li class="chat-room-empty">채팅방이 없습니다.</li>
                </ul>
            </aside>

            <!-- 오른쪽: 채팅 창 -->
            <section class="chat-window">
                <div id="chatPlaceholder" class="chat-placeholder">
                    <p>채팅방을 선택하세요.</p>
                </div>

                <div id="chatContent" class="chat-content" style="display:none;">
                    <div class="chat-window-header">
                        <div class="chat-header-info">
                            <span id="chatPartnerName" class="chat-partner-name">상대방</span>
                            <span id="chatProductBadge" class="chat-product-badge" style="display:none;"></span>
                        </div>
                        <div class="chat-header-actions">
                            <div class="chat-dropdown-wrap">
                                <button class="chat-action-btn" onclick="toggleDropdown()">···</button>
                                <div id="chatDropdown" class="chat-dropdown hidden">
                                    <p onclick="openEndConvModal()">대화 종료하기</p>
                                    <p onclick="openLeaveRoomModal()" class="leave">대화방 나가기</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <ul id="chatMessages" class="chat-messages"></ul>

                    <div class="chat-input-bar">
                        <textarea id="chatInput" class="chat-textarea" rows="2"
                                  placeholder="메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
                        <button id="sendBtn" class="chat-send-btn" onclick="sendMessage()">전송</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 대화 종료 확인 모달 -->
    <div id="endConvModal" class="chat-modal-overlay" style="display:none;">
        <div class="chat-modal-box">
            <p class="chat-modal-title">대화를 종료하시겠습니까?</p>
            <p class="chat-modal-sub">구매 대화의 경우, 상대방도 종료하면<br>구매확정이 됩니다.</p>
            <div class="chat-modal-btns">
                <button class="chat-modal-btn" onclick="closeEndConvModal()">아니오</button>
                <button class="chat-modal-btn confirm" onclick="confirmEndConv()">예</button>
            </div>
        </div>
    </div>

    <!-- 대화방 나가기 확인 모달 -->
    <div id="leaveRoomModal" class="chat-modal-overlay" style="display:none;">
        <div class="chat-modal-box">
            <p class="chat-modal-title">대화내용이 삭제됩니다.</p>
            <p class="chat-modal-sub">정말 나가시겠습니까?</p>
            <div class="chat-modal-btns">
                <button class="chat-modal-btn" onclick="closeLeaveRoomModal()">아니오</button>
                <button class="chat-modal-btn danger" onclick="confirmLeaveRoom()">예</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>

    <!-- 프로필 팝업 -->
    <div id="profilePopup" class="profile-popup" style="display:none;" onclick="event.stopPropagation()">
        <button class="pp-close" onclick="closeProfilePopup()">✕</button>
        <div class="pp-top">
            <div class="pp-avatar-large" id="ppAvatar"></div>
            <div class="pp-info">
                <span class="pp-nickname" id="ppNickname"></span>
                <div class="pp-rating">
                    <span class="pp-star">★</span>
                    <span class="pp-rating-val" id="ppRating">-</span>
                    <span class="pp-trades" id="ppTrades"></span>
                </div>
            </div>
        </div>
        <p class="pp-bio" id="ppBio"></p>
        <button class="pp-report-btn" id="ppReportBtn" onclick="openUserReportModal()">🚨 신고하기</button>
    </div>

    <!-- 사용자 신고 모달 -->
    <div id="userReportModal" class="report-modal-overlay" style="display:none;" onclick="closeUserReportModal(event)">
        <div class="report-modal-box" onclick="event.stopPropagation()">
            <button class="report-modal-close" onclick="closeUserReportModal()">✕</button>
            <h3 class="report-modal-title">사용자 신고</h3>
            <p class="report-modal-desc">신고 사유를 선택해 주세요.</p>
            <div class="report-reason-list">
                <label class="report-reason-item">
                    <input type="radio" name="userReportReason" value="사기 의심" onchange="toggleUserReportDetail()"> 사기 의심
                </label>
                <label class="report-reason-item">
                    <input type="radio" name="userReportReason" value="욕설/비방" onchange="toggleUserReportDetail()"> 욕설/비방
                </label>
                <label class="report-reason-item">
                    <input type="radio" name="userReportReason" value="개인정보 요구" onchange="toggleUserReportDetail()"> 개인정보 요구
                </label>
                <label class="report-reason-item">
                    <input type="radio" name="userReportReason" value="도배/스팸" onchange="toggleUserReportDetail()"> 도배/스팸
                </label>
                <label class="report-reason-item">
                    <input type="radio" name="userReportReason" value="기타" onchange="toggleUserReportDetail()"> 기타
                </label>
            </div>
            <textarea id="userReportDetail" class="report-detail-input" rows="3" placeholder="신고 내용을 입력해 주세요." style="display:none;"></textarea>
            <div id="userReportMsg" class="report-msg"></div>
            <button class="report-submit-btn" onclick="submitUserReport()">신고하기</button>
        </div>
    </div>

    <script th:inline="javascript">
        const SERVER_UID           = /*[[${loginUid}]]*/           null;
        const SERVER_NICKNAME      = /*[[${loginNickname}]]*/      null;
        const INIT_TARGET_UID      = /*[[${initTargetUid}]]*/      null;
        const INIT_TARGET_NICKNAME = /*[[${initTargetNickname}]]*/ null;
        const INIT_PRODUCT_ID      = /*[[${initProductId}]]*/      null;
        const INIT_PRODUCT_NAME    = /*[[${initProductName}]]*/    null;
    </script>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script th:src="@{/js/chat.js}"></script>
</div>
</body>
</html>
