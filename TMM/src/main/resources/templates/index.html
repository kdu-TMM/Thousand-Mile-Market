<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>천리마켓 - TMM</title>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com">
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
    <div class="app-container">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="main-content">
            <script>
                if (new URLSearchParams(location.search).get('q')) {
                    document.write('<style>#section-popular,#section-category,#section-auction,.filter-section-tabs{display:none!important}<\/style>');
                }
            </script>

            <!-- ===== 필터 바 ===== -->
            <div class="filter-bar">
                <div class="filter-top-row">
                    <div class="filter-left">
                        <select class="filter-select" id="filterSido" onchange="updateFilterSigungu()">
                            <option value="">전체 지역</option>
                            <option value="서울특별시">서울</option>
                            <option value="경기도">경기</option>
                            <option value="인천광역시">인천</option>
                            <option value="부산광역시">부산</option>
                            <option value="대구광역시">대구</option>
                            <option value="광주광역시">광주</option>
                            <option value="대전광역시">대전</option>
                            <option value="울산광역시">울산</option>
                            <option value="세종특별자치시">세종</option>
                            <option value="강원도">강원</option>
                            <option value="충청북도">충북</option>
                            <option value="충청남도">충남</option>
                            <option value="전라북도">전북</option>
                            <option value="전라남도">전남</option>
                            <option value="경상북도">경북</option>
                            <option value="경상남도">경남</option>
                            <option value="제주특별자치도">제주</option>
                        </select>
                        <select class="filter-select" id="filterSigungu" onchange="updateFilterDong()" style="display:none">
                            <option value="">시/군/구</option>
                        </select>
                        <select class="filter-select" id="filterDong" onchange="applyFilter()" style="display:none">
                            <option value="">읍/면/동</option>
                        </select>
                        <select class="filter-select" id="filterCategory" onchange="applyFilter()">
                            <option value="">전체 카테고리</option>
                            <option>디지털기기</option>
                            <option>생활가전</option>
                            <option>가구/인테리어</option>
                            <option>생활/주방</option>
                            <option>유아동</option>
                            <option>유아도서</option>
                            <option>여성의류</option>
                            <option>여성잡화</option>
                            <option>남성패션/잡화</option>
                            <option>뷰티/미용</option>
                            <option>스포츠/레저</option>
                            <option>취미/게임/음반</option>
                            <option>도서</option>
                            <option>티켓/교환권</option>
                            <option>e쿠폰</option>
                            <option>가공식품</option>
                            <option>건강기능식품</option>
                            <option>반려동물용품</option>
                            <option>식물</option>
                            <option>기타 중고물품</option>
                        </select>
                        <button class="filter-reset-btn" onclick="resetFilter()">초기화</button>
                    </div>
                    <div class="filter-right">
                        <span class="filter-sort-label">정렬</span>
                        <select class="filter-select" id="sortSelect" onchange="applyFilter()">
                            <option value="latest">최신순</option>
                            <option value="price-asc">가격 낮은순</option>
                            <option value="price-desc">가격 높은순</option>
                            <option value="time-asc">마감 임박순</option>
                            <option value="distance">거리순</option>
                        </select>
                    </div>
                </div>
                <div id="distanceHint" class="distance-hint" style="display:none;">
                    📍 거리순은 지역 필터를 선택하면 해당 지역 상품을 먼저 보여줍니다.
                </div>
                <div class="filter-section-tabs">
                    <button class="fsection-tab active" onclick="showSection('all', this)">전체</button>
                    <button class="fsection-tab" onclick="showSection('popular', this)">인기 상품</button>
                    <button class="fsection-tab" onclick="showSection('auction', this)">경매 진행 중</button>
                </div>
            </div>

            <!-- ===== 인기 상품 ===== -->
            <section class="product-section" id="section-popular">
                <h2 class="product-section-title">인기 상품</h2>
                <div class="product-grid" id="popularGrid">
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:40%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:60%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:45%"></div></div></div>
                </div>
            </section>

            <!-- ===== 경매 상품 ===== -->
            <section class="product-section" id="section-auction">
                <h2 class="product-section-title">경매 진행 중</h2>
                <div class="product-grid" id="auctionGrid">
                    <p id="auctionEmpty" style="display:none; color:#999; padding:16px; grid-column: 1 / -1; white-space: nowrap;">현재 진행 중인 경매가 없습니다.</p>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                </div>
            </section>

            <!-- ===== 전체 중고 물품 (무한 스크롤) ===== -->
            <section class="product-section" id="section-all-items">
                <h2 class="product-section-title">전체 중고 물품</h2>
                <div class="product-grid" id="mainGrid">
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:55%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:40%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:60%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:45%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:35%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:65%"></div></div></div>
                    <div class="product-card product-card-skeleton"><div class="product-image skeleton"></div><div class="product-info"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-text" style="width:50%"></div></div></div>
                </div>
                <div id="scrollSentinel" style="height:1px;"></div>
                <div id="loadingSpinner" class="loading-spinner" style="display:none;">
                    <span>불러오는 중...</span>
                </div>
            </section>

        </main>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <div th:replace="~{fragments/quick-menu :: quickMenu}"></div>
    </div>

    <script th:src="@{/js/index.js}"></script>
</body>
</html>
