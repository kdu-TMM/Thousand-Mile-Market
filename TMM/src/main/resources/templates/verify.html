<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>본인인증 - 천리마켓</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/verify.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-content">
        <div class="verify-card">
            <h2 class="verify-title">본인인증을 진행해 주세요</h2>
            <p class="verify-subtitle">회원가입을 위해 본인 명의 휴대폰으로 인증해 주세요.</p>

            <form class="verify-form" onsubmit="return false;">
                <div class="verify-field">
                    <label class="verify-label">이름</label>
                    <input type="text" id="vName" class="verify-input" placeholder="실명 입력">
                </div>
                <div class="verify-field">
                    <label class="verify-label">주민등록번호</label>
                    <div class="verify-rrn-row">
                        <input type="text" id="vBirth" class="verify-input" placeholder="생년월일 6자리" maxlength="6">
                        <span class="verify-rrn-dash">−</span>
                        <input type="text" id="vGender" class="verify-input verify-input-sm" placeholder="●" maxlength="1">
                        <span class="verify-rrn-mask">● ● ● ● ● ●</span>
                    </div>
                </div>
                <div class="verify-field">
                    <label class="verify-label">통신사</label>
                    <div class="verify-carrier-row">
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="SKT"> SKT</label>
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="KT"> KT</label>
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="LGU+"> LG U+</label>
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="SKT알뜰"> SKT 알뜰</label>
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="KT알뜰"> KT 알뜰</label>
                        <label class="verify-carrier-btn"><input type="radio" name="carrier" value="LG알뜰"> LG 알뜰</label>
                    </div>
                </div>
                <div class="verify-field">
                    <label class="verify-label">휴대폰 번호</label>
                    <div class="verify-phone-row">
                        <input type="tel" id="vPhone" class="verify-input" placeholder="'-' 없이 숫자만 입력">
                        <button type="button" id="sendCodeBtn" class="verify-send-btn" onclick="sendCode()">인증번호 전송</button>
                    </div>
                    <div id="recaptcha-container"></div>
                </div>
                <div class="verify-field" id="codeField" style="display:none;">
                    <label class="verify-label">인증번호</label>
                    <div class="verify-phone-row">
                        <input type="text" id="vCode" class="verify-input" placeholder="인증번호 6자리" maxlength="6">
                        <span class="verify-timer" id="verifyTimer">3:00</span>
                    </div>
                </div>
                <div class="verify-terms">
                    <label class="custom-checkbox verify-terms-all">
                        <input type="checkbox" id="agreeAll" onchange="toggleAllTerms(this)">
                        <span class="check-box">
                            <svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg>
                        </span>
                        <span>전체 동의</span>
                    </label>
                    <div class="verify-terms-divider"></div>
                    <div class="verify-terms-list">
                        <label class="custom-checkbox verify-term-item"><input type="checkbox" class="term-check" data-req="true" onchange="syncAllTerms()"><span class="check-box"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></span><span>[필수] 천리마켓 이용약관 동의</span><a href="#" class="verify-term-link" onclick="return false;">보기</a></label>
                        <label class="custom-checkbox verify-term-item"><input type="checkbox" class="term-check" data-req="true" onchange="syncAllTerms()"><span class="check-box"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></span><span>[필수] 개인정보 수집·이용 동의</span><a href="#" class="verify-term-link" onclick="return false;">보기</a></label>
                        <label class="custom-checkbox verify-term-item"><input type="checkbox" class="term-check" data-req="true" onchange="syncAllTerms()"><span class="check-box"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></span><span>[필수] 휴대폰 본인확인서비스 이용약관</span><a href="#" class="verify-term-link" onclick="return false;">보기</a></label>
                        <label class="custom-checkbox verify-term-item"><input type="checkbox" class="term-check" data-req="false" onchange="syncAllTerms()"><span class="check-box"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></span><span>[선택] 마케팅 정보 수신 동의</span><a href="#" class="verify-term-link" onclick="return false;">보기</a></label>
                        <label class="custom-checkbox verify-term-item"><input type="checkbox" class="term-check" data-req="false" onchange="syncAllTerms()"><span class="check-box"><svg class="check-icon" viewBox="0 0 12 12"><polyline points="1.5,6 4.5,9.5 10.5,2.5"/></svg></span><span>[선택] 광고성 정보 수신 동의</span><a href="#" class="verify-term-link" onclick="return false;">보기</a></label>
                    </div>
                </div>
                <div id="verifyMsg" class="verify-msg"></div>
                <button type="button" class="verify-next-btn" onclick="goNext()">다음</button>
            </form>
        </div>
    </main>

    <script th:src="@{/js/verify.js}"></script>
    <script>
    /* ===== 진단 스크립트 (문제 해결 후 삭제) ===== */
    document.addEventListener('DOMContentLoaded', function () {
        console.log('[진단] verify.js 로드 여부:', typeof sendCode === 'function' ? '✅ OK' : '❌ 미로드 - verify.js 404 가능성');
        console.log('[진단] 버튼 존재 여부:', !!document.querySelector('.verify-send-btn') ? '✅ OK' : '❌ 버튼 없음');
        console.log('[진단] vPhone 요소:', !!document.getElementById('vPhone') ? '✅ OK' : '❌ 없음');
        console.log('[진단] codeField 요소:', !!document.getElementById('codeField') ? '✅ OK' : '❌ 없음');
        console.log('[진단] verifyMsg 요소:', !!document.getElementById('verifyMsg') ? '✅ OK' : '❌ 없음');

        const btn = document.querySelector('.verify-send-btn');
        if (btn) {
            btn.addEventListener('click', function () {
                console.log('[진단] 버튼 클릭 감지됨 ✅');
            });
        }
    });
    </script>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
