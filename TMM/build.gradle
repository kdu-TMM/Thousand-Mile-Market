import java.util.jar.Attributes
import java.util.jar.JarOutputStream
import java.util.jar.Manifest

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kdu.og'
version = '0.0.1-SNAPSHOT'
description = '아마도 천리마켓 TMM'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	
	
	// Google Cloud SQL - MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	// H2 (로컬 개발용 인메모리 DB - 채팅 메시지 저장)
	runtimeOnly 'com.h2database:h2'

	// Google Cloud SQL Socket Factory
	implementation 'com.google.cloud.sql:mysql-socket-factory-connector-j-8:1.26.1'

	// Firebase Admin SDK
	implementation 'com.google.firebase:firebase-admin:9.8.0'
	
	// 로그
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// 웹소켓
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Validation (@NotBlank, @Valid 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// GSON
	implementation 'com.google.code.gson:gson:2.10.1'
	
	// MyBatis
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

	// XML
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	
	
}

tasks.named('test') {
	useJUnitPlatform()
}

// ===== Windows CreateProcess error=206 (클래스패스 경로 너무 긺) 우회 =====
// 클래스패스 전체를 Manifest JAR 하나로 묶어서 전달
tasks.withType(JavaExec).configureEach {
    doFirst {
        if (System.properties['os.name'].toLowerCase().contains('win')) {
            def cpJar = File.createTempFile('classpath', '.jar')
            cpJar.deleteOnExit()
            def mf = new Manifest()
            mf.mainAttributes.put(Attributes.Name.MANIFEST_VERSION, '1.0')
            mf.mainAttributes.put(Attributes.Name.CLASS_PATH,
                classpath.collect { it.toURI().toString() }.join(' '))
            new JarOutputStream(new FileOutputStream(cpJar), mf).close()
            classpath = project.files(cpJar)
        }
    }
}
