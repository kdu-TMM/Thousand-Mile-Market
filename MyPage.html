<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 페이지 - 천리마켓</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-900">

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-12">
                <span class="text-xl font-black text-blue-600 tracking-tighter cursor-pointer" onclick="switchView('dashboard')">천리마켓</span>
                <div class="hidden md:flex gap-8 text-sm font-semibold text-slate-500">
                    <a href="#" class="nav-link nav-active-bar" id="nav-dash" onclick="switchView('dashboard')">내 대시보드</a>
                    <a href="#" class="nav-link" id="nav-sales" onclick="switchView('sales')">내 판매 정보</a>
                    <a href="#" class="hover:text-blue-600">거래 장터</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button class="p-2 text-slate-400 hover:text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
                <div onclick="switchView('settings')" class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs cursor-pointer border border-blue-50 hover:shadow-md transition-all overflow-hidden">
                    <span>K</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-[1400px] mx-auto flex min-h-screen">
        <aside class="w-64 border-r border-slate-50 hidden lg:block py-10 px-4">
            <div class="space-y-1">
                <p class="px-4 text-[11px] font-bold text-slate-400 mb-4 uppercase tracking-widest">메인 메뉴</p>
                <button onclick="switchView('dashboard')" id="side-dash" class="sidebar-link active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    통합 대시보드
                </button>
                <button onclick="switchView('sales')" id="side-sales" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 transition-all text-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10c0 5 5 9 10 10s10-4 10-10V2h-10Z"/></svg>
                    내 판매 정보
                </button>
            </div>
            <div class="mt-10 pt-10 border-t border-slate-50 space-y-1">
                <p class="px-4 text-[11px] font-bold text-slate-400 mb-4 uppercase tracking-widest">계정 관리</p>
                <button onclick="switchView('settings')" id="side-settings" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 transition-all text-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
                    프로필 설정
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto">
            
            <div id="dashboardView" class="p-8 lg:p-12">
                <div class="mb-12 flex flex-col md:flex-row justify-between items-start gap-6">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <h1 class="userNameText text-3xl font-black tracking-tight">김중고 님</h1>
                            <span class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">우수 판매자</span>
                        </div>
                        <p class="userBioText text-slate-400 font-medium italic">천리 길도 거래부터, 믿음직한 중고거래 천리마켓입니다.</p>
                    </div>
                    <button class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold text-sm hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all w-full md:w-auto">새 물품 등록하기</button>
                </div>

                <section class="mb-12">
                    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm p-8 md:p-12 flex flex-col md:flex-row items-center gap-12 md:gap-20">
                        <div class="text-center md:border-r border-slate-50 md:pr-20 w-full md:w-auto">
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">거래 평점</p>
                            <div class="text-6xl font-black text-slate-800 tracking-tighter">4.8 <span class="text-2xl text-slate-300 font-normal">/ 5.0</span></div>
                        </div>
                        <div class="flex-1 w-full flex flex-col justify-center text-center md:text-left">
                            <div class="mb-8">
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">누적 거래 횟수</p>
                                <p class="text-4xl font-black text-slate-900">218 <span class="text-lg font-medium text-slate-400">회</span></p>
                            </div>
                            <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                                <span class="px-4 py-2 bg-blue-600 text-white rounded-full text-xs font-bold"># 친절해요</span>
                                <span class="px-4 py-2 bg-slate-100 text-slate-600 rounded-full text-xs font-bold"># 응답이 빨라요</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="salesView" class="hidden-view p-8 lg:p-12">
                <header class="mb-10">
                    <h1 class="text-3xl font-black tracking-tight mb-2">내 판매 정보</h1>
                    <p class="text-slate-400 font-medium">내가 등록한 상품의 현황과 거래 내역을 관리합니다.</p>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">판매 중</p>
                        <p class="text-3xl font-black text-blue-600">5 건</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">거래 대기</p>
                        <p class="text-3xl font-black text-amber-500">2 건</p>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">판매 완료</p>
                        <p class="text-3xl font-black text-slate-900">12 건</p>
                    </div>
                </div>

                <section class="bg-white rounded-[2rem] border border-slate-100 shadow-sm overflow-hidden">
                    <div class="divide-y divide-slate-50">
                        <div class="p-8 flex items-center gap-8 hover:bg-slate-50/50 transition-all">
                            <div class="w-24 h-24 rounded-2xl flex-shrink-0 img-container shadow-inner border border-slate-50">
                                <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&q=80&w=300" alt="Iphone">
                            </div>
                            <div class="flex-1">
                                <span class="px-2 py-0.5 bg-blue-100 text-blue-600 text-[10px] font-bold rounded">판매중</span>
                                <h3 class="font-bold text-lg text-slate-800 mb-1">아이폰 15 프로 256GB</h3>
                                <p class="text-xl font-black text-slate-900">1,250,000원</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div id="settingsView" class="hidden-view p-8 lg:p-12">
                <header class="mb-12">
                    <h1 class="text-4xl font-black tracking-tight mb-2">프로필 설정</h1>
                    <p class="text-slate-400">개인 정보를 관리하세요.</p>
                </header>

                <section class="bg-white rounded-[2.5rem] border border-slate-100 p-8 space-y-8">
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase">닉네임</label>
                        <input type="text" id="setting-name" value="김중고" class="w-full px-6 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:border-blue-600 font-semibold">
                    </div>
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase">한 줄 소개</label>
                        <textarea id="setting-bio" rows="3" class="w-full px-6 py-4 bg-white border border-slate-100 rounded-2xl outline-none focus:border-blue-600 font-medium resize-none">천리 길도 거래부터, 믿음직한 중고거래 천리마켓입니다.</textarea>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="saveSettings()" class="flex-1 py-5 bg-blue-600 text-white rounded-2xl font-bold text-lg hover:bg-blue-700 transition-all">설정 저장</button>
                        <button onclick="switchView('dashboard')" class="flex-1 py-5 bg-slate-100 text-slate-600 rounded-2xl font-bold text-lg hover:bg-slate-200 transition-all">취소</button>
                    </div>
                </section>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
